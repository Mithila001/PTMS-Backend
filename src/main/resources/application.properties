spring.application.name=ptms

# A profile must be selected explicitly. Do not set spring.profiles.active here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Auditing is intentionally left for Phase 3. The existing audit API remains in the
# codebase, but Envers event integration is disabled during the Phase 1 foundation.
spring.jpa.properties.hibernate.integration.envers.enabled=false

app.seed.enabled=false
