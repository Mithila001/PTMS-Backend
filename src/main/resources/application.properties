spring.application.name=ptms

# A profile must be selected explicitly. Do not set spring.profiles.active here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# PTMS owns its own schema. PostGIS infrastructure remains in public.
spring.flyway.default-schema=ptms
spring.flyway.schemas=ptms
spring.jpa.properties.hibernate.default_schema=ptms

spring.jpa.properties.hibernate.integration.envers.enabled=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

app.seed.enabled=false
