# Local development database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bus_transport_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8080}

server.servlet.session.cookie.same-site=LAX
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.seed.enabled=${APP_SEED_ENABLED:true}

logging.level.org.springframework.security=DEBUG
logging.level.com.tritonptms=DEBUG
logging.level.root=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
